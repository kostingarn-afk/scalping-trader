server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: trader

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scalping}
    username: ${DB_USER:scalping}
    password: ${DB_PASSWORD:scalping}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  consumer-group: trader
  topic:
    trading-signals: trading-signals
    trade-results: trade-results

tinkoff:
  token: ${T_INVEST_TOKEN:}
  sandbox: ${T_INVEST_SANDBOX:true}
  account-id: ${T_INVEST_ACCOUNT_ID:}

trader:
  deposit: 200000
  poll-risk-config-cron: "*/30 * * * * *"
